; Tainacan development PHP overrides.
; Tainacan renders large metadata forms and processes sizable media, so the
; defaults of the official image are too low.

memory_limit = 512M
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000
date.timezone = UTC
