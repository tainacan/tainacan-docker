# Tainacan development vhost.
#
# Serves static files from the shared WordPress volume (and the read-only
# plugin/theme mounts) and forwards PHP to the `wordpress` php-fpm service on
# port 9000.

server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    # Match php.ini upload_max_filesize / post_max_size.
    client_max_body_size 200M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location ~ /\.ht {
        deny all;
    }
}
